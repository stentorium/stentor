# Claude Code Action - Base workflow
# Responds to @claude mentions in issues and PR comments
#
# Copy to: .github/workflows/claude.yml in each repo

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

# Prevent concurrent runs on the same issue/PR
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Trigger on @claude mention, but not from Claude itself (prevent loops)
    if: |
      github.event.sender.login != 'claude[bot]' &&
      github.event.sender.login != 'claude' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 50"
          allowed_tools: |
            Bash(yarn install)
            Bash(yarn build)
            Bash(yarn test)
            Bash(yarn lint)
            Bash(yarn format)
            Bash(npm install)
            Bash(npm run *)
            Bash(npm test)
            Bash(git status)
            Bash(git diff)
            Bash(git log)
            Bash(git add)
            Bash(git commit)
            Bash(git push)
            Bash(git checkout)
            Bash(git branch)
            Bash(gh pr *)
            Bash(gh issue *)
            Read
            Write
            Edit
            Glob
            Grep
