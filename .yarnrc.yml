defaultSemverRangePrefix: ""

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Yarn 4.18 refuses any npm version published less than 24 hours ago (npmMinimalAgeGate,
# default 1440 minutes), with "All versions satisfying <range> are quarantined". It is a
# malware-scan window aimed at compromised third-party releases, and it does not fit our
# own packages: a library here publishes and its consumer bumps the same day, so the gate
# blocks the normal cross-repo flow rather than any attacker. Scoped to first-party names
# only -- do not widen this to third parties. A release also publishes sibling packages in
# the same run, so exempt the namespaces, not single package names.
npmPreapprovedPackages:
  - "@xapp/*"
  - "stentor-*"
  # The base package is named "stentor" with no suffix, so the glob above misses it.
  - "stentor"
